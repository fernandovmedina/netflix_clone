worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Shows which auth container ($upstream_addr) served each request.
    log_format lb '$remote_addr -> $upstream_addr [$time_local] "$request" '
                  '$status $body_bytes_sent $request_time';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    upstream auth_service {
        least_conn;
        # One entry per auth container. To scale up: add authN to
        # docker-compose.yaml, register it here, then run
        #   docker compose up -d --build && docker compose restart nginx
        server auth1:8080;
        server auth2:8080;
        server auth3:8080;
        server auth4:8080;
        server auth5:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
