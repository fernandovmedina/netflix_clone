worker_processes auto;

events {
    worker_connections 2048;
}

http {
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=stream_connections:10m;

    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
    }

    log_format lb '$remote_addr -> $upstream_addr [$time_local] "$request" '
                  '$status $body_bytes_sent $request_time';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    upstream auth_service {
        least_conn;
        server auth1:8080;
        server auth2:8080;
        server auth3:8080;
    }
    upstream catalog_service {
        least_conn;
        server catalog1:8080;
        server catalog2:8080;
    }
    upstream streaming_service {
        least_conn;
        server streaming1:8080;
        server streaming2:8080;
    }
    upstream user_service {
        least_conn;
        server user1:8080;
        server user2:8080;
    }

    server {
        listen 80;
        listen [::]:80;
        client_max_body_size 1m;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}\n';
        }

        location ^~ /api/v1/admin/ {
            # Multipart framing sits above the application's documented 5 GiB
            # file cap; the Go handler remains the authoritative size check.
            client_max_body_size 6g;
            proxy_request_buffering off;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth_strict burst=2 nodelay;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/signup {
            limit_req zone=auth_strict burst=2 nodelay;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/refresh {
            limit_req zone=auth_refresh burst=10 nodelay;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v1/stream/ {
            # This is a concurrency guard, not a request-rate limit. ABR
            # playback is intentionally free to fetch segments in bursts.
            limit_conn stream_connections 24;
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location @rate_limited {
            default_type application/json;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Vary Origin always;
            return 429 '{"error":"too many requests"}\n';
        }

        location / {
            proxy_pass http://auth_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 7200s;
        }
    }

    # Auth uses this un-published listener to retain balancing at every tier.
    server {
        listen 8081;
        client_max_body_size 1m;

        location /catalog/ {
            client_max_body_size 6g;
            proxy_request_buffering off;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            rewrite ^/catalog(/.*)$ $1 break;
            proxy_pass http://catalog_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /streaming/ {
            rewrite ^/streaming(/.*)$ $1 break;
            proxy_pass http://streaming_service;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_read_timeout 300s;
        }

        location /user/ {
            rewrite ^/user(/.*)$ $1 break;
            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
