worker_processes auto;

events {
    worker_connections 2048;
}

http {
    limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=discount_validation:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=oxxo_simulation:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=stream_connections:10m;

    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "http://localhost:3001" $http_origin;
    }

    log_format lb '$remote_addr -> $upstream_addr [$time_local] "$request" '
                  '$status $body_bytes_sent $request_time';
    access_log /dev/stdout lb;
    error_log /dev/stderr warn;

    # A variable proxy target makes OSS nginx re-resolve service replicas
    # through Docker DNS instead of pinning container IPs at worker startup.
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 1s;

    server {
        listen 80;
        listen [::]:80;
        client_max_body_size 1m;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        # Keep local browser origins at the edge so an alternate published
        # frontend port does not require rebuilding or recreating Go services.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Vary;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary Origin always;

        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}\n';
        }

        location ^~ /api/v1/admin/ {
            # Multipart framing sits above the application's documented 5 GiB
            # file cap; the Go handler remains the authoritative size check.
            client_max_body_size 6g;
            proxy_request_buffering off;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            set $backend auth:8080;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth_strict burst=2 nodelay;
            set $backend auth:8080;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/signup {
            limit_req zone=auth_strict burst=2 nodelay;
            set $backend auth:8080;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/refresh {
            limit_req zone=auth_refresh burst=10 nodelay;
            set $backend auth:8080;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/discounts/validate {
            limit_req zone=discount_validation burst=5 nodelay;
            set $backend auth:8080;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v1/payments/oxxo/[^/]+/simulate-payment$ {
            limit_req zone=oxxo_simulation burst=3 nodelay;
            set $backend auth:8080;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v1/stream/ {
            # This is a concurrency guard, not a request-rate limit. ABR
            # playback is intentionally free to fetch segments in bursts.
            limit_conn stream_connections 24;
            set $backend auth:8080;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location @rate_limited {
            default_type application/json;
            return 429 '{"error":"too many requests"}\n';
        }

        location / {
            set $backend auth:8080;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 7200s;
        }
    }

    # Auth uses this un-published listener to retain balancing at every tier.
    server {
        listen 8081;
        client_max_body_size 1m;

        location /catalog/ {
            client_max_body_size 6g;
            proxy_request_buffering off;
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
            set $backend catalog:8080;
            rewrite ^/catalog(/.*)$ $1 break;
            proxy_pass http://$backend$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /streaming/ {
            set $backend streaming:8080;
            rewrite ^/streaming(/.*)$ $1 break;
            proxy_pass http://$backend$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_read_timeout 300s;
        }

        location /user/ {
            set $backend user:8080;
            rewrite ^/user(/.*)$ $1 break;
            proxy_pass http://$backend$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }
}
