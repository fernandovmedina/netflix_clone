# Netflix clone backend: 5 auth containers behind an nginx load balancer.
#
#   docker compose up -d --build
#   curl http://localhost:8080/health   # entry point (nginx)
#
# To add a sixth container: copy one auth service block below, rename it
# auth6, and register `server auth6:8080;` in nginx/nginx.conf.

x-auth-service: &auth-service
  build: ./auth
  env_file: ./auth/.env.local
  restart: unless-stopped
  networks:
    - backend
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    interval: 15s
    timeout: 3s
    retries: 3

services:
  auth1:
    <<: *auth-service
    hostname: auth1
  auth2:
    <<: *auth-service
    hostname: auth2
  auth3:
    <<: *auth-service
    hostname: auth3
  auth4:
    <<: *auth-service
    hostname: auth4
  auth5:
    <<: *auth-service
    hostname: auth5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth1
      - auth2
      - auth3
      - auth4
      - auth5
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
